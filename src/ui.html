<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ferret</title>
<style>
  /* One family throughout. Everything on this screen is a path, a term or a
     number, and a proportional face would misalign all three. */
  :root {
    --paper: #E8ECEE;
    --card:  #FCFDFD;
    --ink:   #12202A;
    --dim:   #5E717B;
    --rule:  #C2CDD3;
    --accent:#0E6B7B;
    --mark:  #FFD86B;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; }

  /* --- console ---------------------------------------------------------- */
  .console { display: flex; align-items: flex-end; gap: 20px; }
  .field { flex: 1 1 auto; min-width: 0; }
  .field label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  input[type=search] {
    width: 100%;
    font: inherit;
    font-size: 22px;
    padding: 10px 14px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
  }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=search]::placeholder { color: #9AACB4; }

  .readout { flex: 0 0 auto; text-align: right; padding-bottom: 2px; }
  .readout .ms {
    font-size: 46px;
    line-height: 1;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--accent);
  }
  .readout .unit { font-size: 14px; color: var(--dim); margin-left: 4px; font-weight: 400; }
  .readout .caption { color: var(--dim); font-size: 12px; }

  /* --- counters --------------------------------------------------------- */
  .counters {
    margin-top: 18px; padding-top: 12px;
    border-top: 1px solid var(--rule);
    display: flex; flex-wrap: wrap; gap: 28px;
    color: var(--dim); font-size: 12.5px;
  }
  .counters b {
    color: var(--ink); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* --- layout ----------------------------------------------------------- */
  .split { display: grid; grid-template-columns: minmax(0,1fr) 292px; gap: 40px; margin-top: 26px; }
  @media (max-width: 980px) { .split { grid-template-columns: minmax(0,1fr); } }

  /* --- results ---------------------------------------------------------- */
  .hit { padding: 15px 0; border-top: 1px solid var(--rule); }
  .hit:first-child { border-top: none; }
  .hit.on { box-shadow: -14px 0 0 0 var(--accent); }
  .hit .top { display: flex; gap: 14px; align-items: baseline; }
  .hit .path { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .hit .dir { color: var(--dim); }
  .hit .file { font-weight: 600; }
  .hit .score {
    flex: 0 0 auto; color: var(--dim); font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .hit .snip {
    margin-top: 6px; color: #33454F;
    max-width: 74ch; overflow-wrap: anywhere;
  }
  .hit .snip mark {
    background: var(--mark); color: var(--ink);
    padding: 1px 1px; border-radius: 2px;
  }
  .hit .where { color: var(--dim); }

  /* --- plan rail -------------------------------------------------------- */
  .rail h2 { font-size: 12px; font-weight: 600; color: var(--dim); margin: 0 0 10px; }
  table.plan { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.plan th {
    text-align: right; font-weight: 400; color: var(--dim);
    border-bottom: 1px solid var(--rule); padding: 0 0 5px;
  }
  table.plan th:first-child { text-align: left; }
  table.plan td {
    padding: 4px 0; font-variant-numeric: tabular-nums; text-align: right;
    border-bottom: 1px dotted var(--rule);
  }
  table.plan td:first-child { text-align: left; overflow-wrap: anywhere; padding-right: 8px; }
  table.plan tr.absent td { color: #9AACB4; }
  .rail .note { color: var(--dim); font-size: 12px; margin-top: 14px; max-width: 34ch; }

  /* --- states ----------------------------------------------------------- */
  .state { padding: 44px 0; color: var(--dim); max-width: 56ch; }
  .state b { color: var(--ink); font-weight: 600; }
  .state kbd {
    background: var(--card); border: 1px solid var(--rule); border-bottom-width: 2px;
    border-radius: 3px; padding: 0 5px; font: inherit; font-size: 12px; color: var(--ink);
  }
  .err { color: #9A2B21; }

  @media (prefers-reduced-motion: no-preference) {
    .readout .ms { transition: color 120ms linear; }
  }
</style>
</head>
<body>
<div class="shell">

  <div class="console">
    <div class="field">
      <label for="q">Search this folder</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="postings list   &quot;memory bounded&quot;   +bm25 -test   ext:rs">
    </div>
    <div class="readout">
      <div><span class="ms" id="ms">—</span><span class="unit">ms</span></div>
      <div class="caption" id="caption">query time</div>
    </div>
  </div>

  <div class="counters" id="counters"></div>

  <div class="split">
    <main id="results">
      <div class="state" id="state"></div>
    </main>
    <aside class="rail">
      <h2>How this query ran</h2>
      <div id="plan"><p class="note">Term statistics appear here once you search.</p></div>
    </aside>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let stats = null, timer = null, selected = -1, lastHits = [];

const esc = (s) => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n = (x) => (x ?? 0).toLocaleString();

async function boot() {
  try {
    stats = await (await fetch('/api/stats')).json();
    idle();
  } catch (e) {
    $('state').innerHTML = '<span class="err">Cannot reach the index. Is <b>ferret serve</b> still running?</span>';
  }
}

function idle() {
  $('state').innerHTML =
    `<b>${n(stats.docs)} files</b> indexed from ${esc(stats.root)}, ` +
    `${n(stats.terms)} distinct terms across ${stats.segments} segment${stats.segments === 1 ? '' : 's'}.` +
    `<p>Quote a phrase to match words in order. Prefix a word with <kbd>+</kbd> to require it, ` +
    `<kbd>-</kbd> to exclude it, or end it with <kbd>*</kbd> to match by prefix. ` +
    `Narrow by file type with <kbd>ext:rs</kbd>.</p>`;
  $('counters').innerHTML = '';
  $('plan').innerHTML = '<p class="note">Term statistics appear here once you search.</p>';
}

function render(data) {
  $('ms').textContent = data.took_ms.toFixed(1);
  $('caption').textContent = data.total === 0 ? 'no matches' : `top ${data.hits.length} of ${n(data.total)}`;

  $('counters').innerHTML = [
    ['matched', n(data.total)],
    ['postings scanned', n(data.plan.postings_scanned)],
    ['segments read', n(data.plan.segments)],
    ['corpus', n(stats.docs) + ' files'],
  ].map(([k, v]) => `${k} <b>${v}</b>`).join('');

  if (data.hits.length === 0) {
    $('results').innerHTML = `<div class="state">Nothing matched <b>${esc(data.query)}</b>.` +
      `<p>Try fewer words, or end a word with <kbd>*</kbd> to match by prefix.</p></div>`;
  } else {
    lastHits = data.hits;
    $('results').innerHTML = data.hits.map((h, i) => {
      const cut = h.path.lastIndexOf('/');
      const dir = cut >= 0 ? esc(h.path.slice(0, cut + 1)) : '';
      const file = esc(cut >= 0 ? h.path.slice(cut + 1) : h.path);
      const where = h.line ? `<span class="where">:${h.line}</span>` : '';
      return `<article class="hit" data-i="${i}">
        <div class="top">
          <div class="path"><span class="dir">${dir}</span><span class="file">${file}</span>${where}</div>
          <div class="score">${h.score.toFixed(3)}</div>
        </div>
        <div class="snip">${h.snippet}</div>
      </article>`;
    }).join('');
  }

  const rows = data.plan.terms.map(t =>
    `<tr class="${t.df === 0 ? 'absent' : ''}">
       <td>${esc(t.term)}</td><td>${n(t.df)}</td><td>${t.idf.toFixed(2)}</td>
       <td>${(t.bytes / 1024).toFixed(1)}</td>
     </tr>`).join('');
  $('plan').innerHTML = rows
    ? `<table class="plan"><thead><tr><th>term</th><th>docs</th><th>idf</th><th>KB</th></tr></thead>
       <tbody>${rows}</tbody></table>
       <p class="note">KB is the compressed postings actually read for that term.
       ${data.plan.tombstones_skipped > 0 ? n(data.plan.tombstones_skipped) + ' stale postings were skipped from files edited since the last merge.' : ''}</p>`
    : '<p class="note">No terms in that query.</p>';
}

async function run() {
  const q = $('q').value.trim();
  if (!q) { idle(); $('ms').textContent = '—'; $('caption').textContent = 'query time'; return; }
  try {
    const r = await fetch('/api/search?limit=25&q=' + encodeURIComponent(q));
    if (!r.ok) throw new Error(await r.text());
    render(await r.json());
    selected = -1;
  } catch (e) {
    $('results').innerHTML = `<div class="state err">Search failed: ${esc(String(e.message || e))}</div>`;
  }
}

$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 90); });

document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); return; }
  if (!lastHits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    selected = Math.max(0, Math.min(lastHits.length - 1, selected + (e.key === 'ArrowDown' ? 1 : -1)));
    document.querySelectorAll('.hit').forEach((el, i) => el.classList.toggle('on', i === selected));
    document.querySelector('.hit.on')?.scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'Enter' && selected >= 0) {
    navigator.clipboard?.writeText(lastHits[selected].path);
    $('caption').textContent = 'path copied';
  }
});

boot();
</script>
</body>
</html>
