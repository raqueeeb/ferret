name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: "test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # SQLite is compiled from source through rusqlite's `bundled`
        # feature, so none of these need a system libsqlite3. Windows is here
        # because it is where the path-separator bugs showed up.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: "toolchain"
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: "formatting"
        run: cargo fmt --check
      - name: "clippy"
        run: cargo clippy --all-targets -- -D warnings
      - name: "tests"
        run: cargo test --all-targets
      - name: "the binary runs"
        run: cargo run --release -- --help

  msrv:
    name: "minimum supported rust version"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "toolchain"
        run: rustup toolchain install 1.75 --profile minimal && rustup default 1.75
      - name: "build"
        run: cargo build --all-targets
